[project]
name = "astro-window"
version = "1.0.0"
description = "Astro Window backend — UK observing windows and beginner targets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.0",
    "psycopg[binary]>=3.3.0",
    # celery[redis]/kombu currently require redis-py <6.5; Redis *server* is 8.
    "redis>=6.4.0,<6.5",
    "celery[redis]>=5.6.0",
    "httpx>=0.28.0",
    "astropy>=8.0.0",
    "email-validator>=2.3.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.16.0",
    "black>=26.5.0",
    "fakeredis>=2.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
