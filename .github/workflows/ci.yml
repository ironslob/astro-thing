name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Black
        run: black --check app tests
      - name: Tests
        run: pytest -q
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          SECRET_KEY: ci-secret
      - name: Alembic schema matches ORM
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrate.db
          SECRET_KEY: ci-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend --build-arg VITE_API_BASE_URL=/api/v1
      - name: Build gateway image
        run: docker build -f gateway/Dockerfile gateway
