services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro_window
    volumes:
      # Postgres 18 stores data under /var/lib/postgresql/<major>/docker.
      # Existing 16 volumes at /var/lib/postgresql/data will not migrate;
      # run `docker compose down -v` once after this upgrade.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro_window"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      SECRET_KEY: local-dev-only-change-me
      SCORING_VERSION: "1.0.0"
      DATABASE_URL: postgresql+psycopg://astro:astro@postgres:5432/astro_window
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Astro Window <noreply@local.test>"
      FRONTEND_BASE_URL: http://localhost:8080
      SESSION_COOKIE_NAME: astro_session
      SESSION_COOKIE_SECURE: "false"
      OPEN_METEO_BASE_URL: https://api.open-meteo.com
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes:
      - ./data:/data:ro
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-l", "info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes:
      - ./data:/data:ro
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "-l", "info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend

  gateway:
    image: nginx:1.30-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
